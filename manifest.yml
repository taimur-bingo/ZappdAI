display_information:
  name: ZappdAI
  description: Restaurant customer intake & post-sales handoff for Zappd
  background_color: "#1a1a2e"

features:
  bot_user:
    display_name: ZappdAI
    always_online: true
  slash_commands:
    - command: /intake
      description: Start a restaurant customer intake & post-sales handoff
      should_escape: false

oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - channels:manage
      - groups:write
      - channels:read
      - groups:read
      - users:read
      - users:read.email
      - pins:write
      - im:write

settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
